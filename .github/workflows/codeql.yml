name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly sweep so a newly disclosed pattern is caught even without a push.
    - cron: '23 4 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # security-extended adds lower-severity queries on top of the default set.
          queries: security-extended

      # No build step: the plugin is plain ESM run directly by Node, so CodeQL
      # extracts straight from the sources. Keeping it build-free also means the
      # scan cannot be fooled by generated output.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'

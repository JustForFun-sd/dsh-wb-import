name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Syntax and format checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check (host half)
        run: node --check lib/index.js

      - name: Syntax check (client half)
        run: node --check lib/client.js

      - name: Syntax check (tests)
        run: |
          node --check test/lifecycle-validator.mjs
          node --check test/test-validator-negative.mjs
          node --check test/test-import-shape.mjs

      - name: Validate package.json
        run: node -e "const p=require('./package.json'); if(!p.name||!p.version||!p.dsh) { console.error('package.json missing name/version/dsh'); process.exit(1); } console.log(p.name+'@'+p.version)"

      - name: Validate cordis patch file
        run: node -e "const fs=require('fs'); const t=fs.readFileSync('cordis.patch.yml','utf8'); if(!/dsh-wb-import/.test(t)) { console.error('cordis.patch.yml does not mention dsh-wb-import'); process.exit(1); } console.log('patch file ok')"

      - name: Host lifecycle validator (negative cases)
        run: node test/test-validator-negative.mjs

      - name: Import shape test (self-contained)
        run: node test/test-import-shape.mjs

      - name: npm pack contents
        run: npm pack --dry-run

  lint-docs:
    name: Docs sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: README links resolve
        run: node scripts/readme-links.mjs

      - name: No local paths leaked
        run: node scripts/leakcheck.mjs
